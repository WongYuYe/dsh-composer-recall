<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小龙虾像素分区页</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23081314'/%3E%3Crect x='1' y='1' width='14' height='14' fill='%2385b7af'/%3E%3Crect x='3' y='3' width='10' height='3' fill='%23f4f1cf'/%3E%3Crect x='3' y='7' width='10' height='6' fill='%23d65c4f'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./openclaw.config.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <main class="map-home" id="mapHome" data-zone="none">
        <header class="map-header panel">
          <div>
            <p class="eyebrow">OPENCLAW 运行舱</p>
            <h1>小龙虾运行舱</h1>
          </div>
          <div class="zone-pills">
            <span class="zone-pill" data-zone="rest">休息区</span>
            <span class="zone-pill" data-zone="work">工作区</span>
            <span class="zone-pill" data-zone="alarm">警报区</span>
          </div>
        </header>

        <section class="map-card panel">
          <div class="map-screen">
            <div class="map-scroller">
              <div class="map-world">
                <div
                  class="map-grid map-grid--phaser"
                  id="mapGrid"
                  aria-label="小龙虾休息区工作区警报区像素地图"
                ></div>
              </div>
            </div>

            <div class="map-bottom">
              <div class="map-banner" id="mapBanner">
                等待状态返回，小龙虾将按真实位置落点。
              </div>

              <div class="map-legend">
                <span><i class="legend-chip legend-chip--rest"></i>休息区</span>
                <span><i class="legend-chip legend-chip--work"></i>工作区</span>
                <span
                  ><i class="legend-chip legend-chip--alarm"></i>警报区</span
                >
                <span
                  ><i class="legend-chip legend-chip--robot"></i
                  >小龙虾位置</span
                >
              </div>
            </div>
          </div>
        </section>
      </main>

      <aside class="sidebar">
        <section class="sidebar-card panel sidebar-card--hero">
          <div class="sidebar-head">
            <div>
              <p class="eyebrow">任务总览</p>
              <h2>当前状态</h2>
            </div>
            <div class="sidebar-head__meta">
              <span class="sync-badge sync-badge--offline" id="syncBadge"
                >离线</span
              >
              <span class="mode-chip" id="runModeChip">runtime</span>
              <span class="clock" id="clock">--:--:-- 北京时间</span>
            </div>
          </div>

          <div class="mission-card">
            <div class="card-heading">
              <div>
                <p class="eyebrow">当前状态</p>
                <h2 id="zoneName">未连接</h2>
              </div>
            </div>
            <div class="agent-tabs" id="agentTabs">
              <button
                type="button"
                class="agent-tab is-active"
                data-agent="main"
              >
                main
              </button>
              <button type="button" class="agent-tab" data-agent="research">
                research
              </button>
              <button type="button" class="agent-tab" data-agent="executor">
                executor
              </button>
              <button type="button" class="agent-tab" data-agent="ops">
                ops
              </button>
            </div>
            <p class="mission-card__task" id="taskName">等待后台状态</p>
            <p class="mission-card__summary" id="taskSummary">
              后台返回当前分区和坐标后，主视图会先经过分区总览，再切到对应房间，并把小龙虾落到室内真实位置。
            </p>
            <div class="task-detail" id="taskDetail" hidden>
              <div class="task-detail__head">
                <span class="agent-chip" id="taskDetailStatus">idle</span>
                <span class="task-detail__meta" id="taskDetailMeta"
                  >暂无运行任务</span
                >
              </div>
              <div class="task-detail__title" id="taskDetailTitle">
                暂无运行任务
              </div>
              <div class="task-detail__summary" id="taskDetailSummary">
                等待任务进入运行态。
              </div>
            </div>
            <div class="critical-banner" id="criticalBanner" hidden></div>
            <div class="task-actions" id="taskActions" hidden>
              <div class="task-actions__buttons">
                <button
                  type="button"
                  class="task-action-btn"
                  id="retryTaskButton"
                >
                  重试任务
                </button>
                <button
                  type="button"
                  class="task-action-btn task-action-btn--secondary"
                  id="resolveTaskButton"
                >
                  处理完成
                </button>
              </div>
              <p class="task-actions__note" id="taskActionNote"></p>
            </div>
          </div>
        </section>

        <section class="sidebar-card panel telemetry-card">
          <div class="card-heading">
            <div>
              <p class="eyebrow">角色总览</p>
              <h2>四角色状态</h2>
            </div>
          </div>
          <div class="agent-overview" id="agentOverview"></div>
          <div class="agent-panels" id="agentPanels"></div>
          <dl class="metric-grid metric-grid--summary metric-grid--minimal">
            <div class="metric-box metric-box--highlight">
              <dt>模式</dt>
              <dd id="modeValue">离线</dd>
            </div>
            <div class="metric-box metric-box--highlight">
              <dt>告警</dt>
              <dd id="alertValue" data-alert="OFFLINE">离线</dd>
            </div>
            <div class="metric-box">
              <dt>队列</dt>
              <dd id="queueValue">--</dd>
            </div>
          </dl>
        </section>

        <section class="sidebar-card panel debug-card">
          <div class="card-heading">
            <div>
              <p class="eyebrow">事件流</p>
              <h2>最近变化</h2>
            </div>
          </div>

          <div class="debug-card__section">
            <div class="ops-card__subhead">
              <p class="eyebrow">状态判断</p>
            </div>
            <div class="debug-summary" id="recentSummary">
              等待状态同步后生成摘要。
            </div>
          </div>

          <div class="debug-card__section">
            <div class="ops-card__subhead">
              <p class="eyebrow">主事件流</p>
            </div>
            <ol class="timeline-list" id="timelineList"></ol>
          </div>
        </section>
      </aside>
    </div>

    <script src="./vendor/phaser.min.js"></script>
    <script src="./phaser-map.js?v=20260312-1"></script>
    <script src="./app.js?v=20260314-browser-automation-fix"></script>
  </body>
</html>
